name: Vision 1 tests

on:
  push:
    branches: [vision-1]
  pull_request:
    branches: [vision-1]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Vision 1 tests
        run: pytest -q tests
