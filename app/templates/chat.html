<!DOCTYPE html>
<html>
<head>
    <title>Chat IA</title>
</head>
<body>

<h1>🧠 Chat IA con Memoria</h1>

<form method="POST">
    <input type="text" name="message" placeholder="Escribe tu pregunta..." style="width:300px;">
    <button type="submit">Enviar</button>
</form>

<hr>

{% if user_message %}
<p><b>Tú:</b> {{ user_message }}</p>
{% endif %}

{% if answer %}
<h3>Respuesta IA:</h3>
<pre>{{ answer }}</pre>
{% endif %}

</body>
</html>
