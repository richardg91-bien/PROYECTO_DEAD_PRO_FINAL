<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<title>Chat {{ persona }}</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<h1>🤖 Memoria de {{ persona }}</h1>

<form method="POST">

    <textarea
        name="message"
        placeholder="Haz una pregunta..."
        required>
    </textarea>

    <br><br>

    <button type="submit">
        Preguntar
    </button>

</form>

{% if respuesta %}

<hr>

<h3>Respuesta</h3>

<pre>{{ respuesta }}</pre>

{% endif %}

<br>

<a href="/persona/{{ persona }}">
    Volver al perfil
</a>

</body>
</html>
