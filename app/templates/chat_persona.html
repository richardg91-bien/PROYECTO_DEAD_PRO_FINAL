<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Chat con {{ persona }}</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            margin-top: 20px;
        }

        .chat-box {
            width: 90%;
            max-width: 600px;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }

        .mensaje {
            margin-bottom: 15px;
        }

        .usuario {
            text-align: right;
            color: #00d4ff;
        }

        .respuesta {
            text-align: left;
            color: #00ff88;
        }

        form {
            width: 90%;
            max-width: 600px;
            margin-top: 20px;
            display: flex;
        }

        input {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 5px;
            outline: none;
        }

        button {
            padding: 10px 15px;
            margin-left: 10px;
            border: none;
            border-radius: 5px;
            background: #00ff88;
            cursor: pointer;
        }

        audio {
            margin-top: 10px;
            width: 100%;
        }
    </style>
</head>

<body>

    <h1>💬 Chat con {{ persona }}</h1>

    <div class="chat-box">

        {% if message %}
            <div class="mensaje usuario">
                <strong>Vos:</strong> {{ message }}
            </div>
        {% endif %}

        {% if respuesta %}
            <div class="mensaje respuesta">
                <strong>{{ persona }}:</strong> {{ respuesta }}

                {% if audio %}
                    <audio controls autoplay>
                        <source src="/{{ audio }}" type="audio/mpeg">
                        Tu navegador no soporta audio.
                    </audio>
                {% endif %}
            </div>
        {% endif %}

    </div>

    <form method="POST">
        <input type="text" name="message" placeholder="Escribí un mensaje..." required>
        <button type="submit">Enviar</button>
    </form>

</body>
</html>
