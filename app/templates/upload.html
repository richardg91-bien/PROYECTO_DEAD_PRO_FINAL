{% extends "base.html" %}

{% block content %}
<div style="max-width: 600px; margin: 40px auto;">
    <h2>📤 Subir recuerdo</h2>

    {% if error %}
    <div style="background: #ff6666; padding: 15px; margin: 20px 0; border-radius: 8px; color: white;">
        ❌ {{ error }}
    </div>
    {% endif %}

    <form action="/upload" method="POST" enctype="multipart/form-data" style="display: flex; flex-direction: column; gap: 15px;">
        <input
            type="text"
            name="persona"
            placeholder="Nombre de la persona"
            minlength="2"
            maxlength="100"
            required
            style="padding: 10px; border: 1px solid #444; border-radius: 8px; background: #222; color: white;">

        <input
            type="text"
            name="title"
            placeholder="Título del recuerdo"
            minlength="3"
            maxlength="200"
            required
            style="padding: 10px; border: 1px solid #444; border-radius: 8px; background: #222; color: white;">

        <textarea
            name="description"
            placeholder="Descripción (mínimo 10 caracteres)"
            minlength="10"
            maxlength="2000"
            rows="5"
            required
            style="padding: 10px; border: 1px solid #444; border-radius: 8px; background: #222; color: white; font-family: Arial;"></textarea>

        <textarea
            name="perfil"
            placeholder="Perfil inicial de personalidad (opcional)"
            maxlength="1000"
            rows="3"
            style="padding: 10px; border: 1px solid #444; border-radius: 8px; background: #222; color: white; font-family: Arial;"></textarea>

        <input
            type="file"
            name="image"
            accept="image/*"
            required
            style="padding: 10px;">

        <button type="submit" style="padding: 12px; background: #00aaff; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px;">
            ✅ Subir
        </button>
    </form>

    <br>
    <a href="/" style="color: #00aaff; text-decoration: none;">← Volver</a>
</div>
{% endblock %}
